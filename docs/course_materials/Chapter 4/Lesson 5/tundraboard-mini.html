<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TundraBoard Mini</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 46rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.6rem; }
  section { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  input, select, button { font: inherit; padding: 0.35rem 0.5rem; margin-right: 0.4rem; }
  ul { padding-left: 1.2rem; }
  .metric { display: inline-block; margin-right: 2rem; }
  .metric strong { font-size: 1.8rem; display: block; }
  .danger { border-color: #b00; }
  .danger button { background: #b00; color: #fff; border: none; border-radius: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>TundraBoard Mini</h1>

<section id="login-view">
  <h2>Sign in</h2>
  <p>Demo build. Any email and password are accepted.</p>
  <form id="login-form">
    <input id="email" type="email" placeholder="you@example.org" required>
    <input id="password" type="password" placeholder="password" required>
    <button type="submit">Sign in</button>
  </form>
</section>

<div id="app-view" hidden>

  <section id="dashboard">
    <h2>Dashboard</h2>
    <span class="metric">Projects <strong id="project-count">0</strong></span>
    <span class="metric">Tasks <strong id="task-count">0</strong></span>
    <p id="signed-in-as"></p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <form id="project-form">
      <input id="project-name" placeholder="Project name" required>
      <button type="submit">Create project</button>
    </form>
    <ul id="project-list"></ul>
  </section>

  <section id="tasks">
    <h2>Tasks</h2>
    <form id="task-form">
      <select id="task-project"></select>
      <input id="task-title" placeholder="Task title" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="task-list"></ul>
  </section>

  <section id="danger-zone" class="danger">
    <h2>Settings &mdash; danger zone</h2>
    <button id="delete-all">Delete all projects and tasks</button>
  </section>

</div>

<script>
  var projects = [];
  var tasks = [];

  function refresh() {
    document.getElementById('project-count').textContent = projects.length;
    document.getElementById('task-count').textContent = tasks.length;

    var plist = document.getElementById('project-list');
    plist.textContent = '';
    var select = document.getElementById('task-project');
    select.textContent = '';
    projects.forEach(function (name) {
      var li = document.createElement('li');
      li.textContent = name;
      plist.appendChild(li);
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });

    var tlist = document.getElementById('task-list');
    tlist.textContent = '';
    tasks.forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = t.title + ' (' + t.project + ')';
      tlist.appendChild(li);
    });
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('login-view').hidden = true;
    document.getElementById('app-view').hidden = false;
    document.getElementById('signed-in-as').textContent =
      'Signed in as ' + document.getElementById('email').value;
    refresh();
  });

  document.getElementById('project-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('project-name').value.trim();
    if (name && projects.indexOf(name) === -1) { projects.push(name); }
    document.getElementById('project-name').value = '';
    refresh();
  });

  document.getElementById('task-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = document.getElementById('task-title').value.trim();
    var project = document.getElementById('task-project').value;
    if (title && project) { tasks.push({ title: title, project: project }); }
    document.getElementById('task-title').value = '';
    refresh();
  });

  document.getElementById('delete-all').addEventListener('click', function () {
    projects = [];
    tasks = [];
    refresh();
  });
</script>

</body>
</html>
